adv.main_story_temple_of_gideon_town.200.x.n2.text=Мэр не выходит на главную дорогу через город.
adv.main_story_temple_of_gideon_town.200.x.n4.text=Обыскав большую часть города, вы все еще не нашли мэра, но, оглядываясь назад в этом направлении, вы, наконец, замечаете их в конце улицы.
