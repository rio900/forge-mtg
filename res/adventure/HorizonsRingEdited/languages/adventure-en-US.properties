adv.aerie_aerie_0.92.d.n0.text=Добро пожаловать, '{'var=player_name'}', я вижу, что вы здесь, чтобы посмотреть на некоторых наших прекрасных птиц. Вы, должно быть, довольно умны, чтобы прийти к нам, так как наши цены действительно не имеют себе равных по сравнению с ценами других продавцов в Шандаларе!
adv.aerie_aerie_0.92.d.n1.text=Я работаю в авиационной гильдии, мы являемся одним из крупнейших конгломератов заводчиков различных видов птиц Шандалара. У нас есть несколько мест размножения, как это разбросано вокруг различных биомов Шандалара. Моя задача - продать этих птиц нетерпеливым авантюристам вроде вас. Так что оглянитесь вокруг.
adv.aerie_aerie_0.92.d.n2.name=Кто ты такой?
adv.aerie_aerie_0.92.d.n3.text=Боюсь вам сказать, что вам не разрешают это делать. Наша гильдия очень защищает свои методы разведения, которые разрабатывались на протяжении более чем тысяч лет. Из-за этого мы не хотим, чтобы наши конкуренты заглядывали в наш бизнес. Если кто-то без разрешения войдет в аэрозоль, этому человеку будут выговорены различные охранники и даже птицы, которые были обучены нападать на нежелательных злоумышленников.
adv.aerie_aerie_0.92.d.n4.name=Мне разрешено входить в аэрозоль?
adv.aerie_aerie_0.92.d.n6.name=Спасибо за информацию, до свидания.
adv.aerie_aerie_1.99.d.n0.text=Надпись гласит: Несанкционированных посетителей предупреждают, впереди опасные птицы.
adv.cave_cave_dwarf.84.d.n0.text=Надпись гласит: Не входи, мертвый внутри.
adv.cave_cave_multilevel_cave_16BR3U.83.d.n0.text=Большие ворота блокируют путь. Через бары можно увидеть внушительную фигуру в комнате за ее пределами. (Вам нужно все пять осколков из этого подземелья, чтобы открыть эти ворота.)
adv.cave_cave_multilevel_cave_16BR3U.83.d.n2.text=Ворота не заперты.
adv.cave_cave_multilevel_cave_16BR3U.83.d.n3.name=Разблокируйте пять осколков
adv.debug_map.52.d.n0.text=Я - большая дверь.
adv.debug_map.52.d.n1.name=Ладно.
adv.debug_map.69.d.n0.text=Не обращай на меня внимания, просто остынь.
adv.debug_map.69.d.n1.name=Конечно.
adv.debug_map.80.d.n0.text=Я эльф. Я занимаюсь эльфами, обнимаю деревья и симпатизирую.
adv.debug_map.80.d.n1.name=Хорошо.
adv.debug_map.80.d.n10.name=Подождите, это была шутка!!!
adv.debug_map.80.d.n11.text=Она ушла, плакала, ты монстр.
adv.debug_map.80.d.n12.name=Куда делся Эмракул?
adv.debug_map.80.d.n13.name=Извините...
adv.debug_map.80.d.n14.text=Возьми этот предмет.
adv.debug_map.80.d.n15.name=Это круто, мой зелёный чувак.
adv.debug_map.80.d.n16.name=Спасибо, брат.
adv.debug_map.80.d.n17.text=Добро пожаловать.
adv.debug_map.80.d.n18.name=Спасибо за благословение.
adv.debug_map.80.d.n19.name=Пальцы вверх эмодзи
adv.debug_map.80.d.n2.text=С радостью.
adv.debug_map.80.d.n20.text=Если ты дашь мне Сокровище, я дам тебе благословения отлавливающего Эльфа.\n Кто такие эльфы Ллановара и 2 дополнительных жизни в твоей следующей битве.
adv.debug_map.80.d.n21.name=Есть какие-нибудь причудливые эльфийские благословения?
adv.debug_map.80.d.n22.name=Но я люблю свое сокровище! Смиренно отказываюсь.
adv.debug_map.80.d.n23.name=Я возьму его.
adv.debug_map.80.d.n24.text=Раз уж ты вежливо попросила, я сделаю это.
adv.debug_map.80.d.n25.name=Ты можешь открыть эту скрытую стену?
adv.debug_map.80.d.n26.name=Спасибо, брат.
adv.debug_map.80.d.n27.text=А, может, ты мне поможешь. Можешь спросить Дебага Демона о его любимом цвете?
adv.debug_map.80.d.n28.name=Есть квест?
adv.debug_map.80.d.n29.name=Это странно, но конечно.
adv.debug_map.80.d.n3.name=Сражайся со мной, эльф!
adv.debug_map.80.d.n30.name=Этот парень пугает меня, я бы не хотел.
adv.debug_map.80.d.n31.text=Пожалуйста, дайте мне знать, каков ответ Дебаг Демона.
adv.debug_map.80.d.n32.name=Об этом квесте...
adv.debug_map.80.d.n33.name=Конечно
adv.debug_map.80.d.n34.text=Спасибо, друг, возьми это золото за неудобства.
adv.debug_map.80.d.n35.name=Понял, брат.
adv.debug_map.80.d.n36.name=Спасибо.
adv.debug_map.80.d.n4.name=Разве ты не мудак для эльфа?..
adv.debug_map.80.d.n5.text=Слушайте лес, друг.\n Ваша цветовая идентичность теперь зеленая!
adv.debug_map.80.d.n6.name=Я тоже хочу быть экологичным.
adv.debug_map.80.d.n7.name=Потрясающе.
adv.debug_map.80.d.n8.text=О, ну... твои похороны.\nHEY EMMY! Этот хулиган хочет танцевать!
adv.debug_map.80.d.n9.name=Я хочу драться с Эмракулом там!
adv.debug_map.80.x.n0.text=Впечатляющий...
adv.debug_map.80.x.n1.name=Почему ты до сих пор стоишь?..
adv.debug_map.81.d.n0.text=Ты... ты ранил лягушачьего!\nТы...ты грязная свинья! Я не остановлюсь ни перед чем, пока не увижу тебя побежденным!\nБоги...любой! Дай мне силы! Дай мне отомстить!!!!
adv.debug_map.81.d.n1.name=Ооо.
adv.debug_map.82.d.n0.text=...
adv.debug_map.82.d.n1.name=???
adv.debug_map.83.d.n0.text=У меня есть кое-что, что я могу предложить за ту жизнь, которую ты...
adv.debug_map.83.d.n1.name=Ты подозрителен и у тебя две тени, я выхожу.
adv.debug_map.83.d.n10.name=Я держу тебя за руку.
adv.debug_map.83.d.n11.name=Чувак...
adv.debug_map.83.d.n12.text=Я могу предложить вам это Сокровище по справедливой цене 200 золотых.
adv.debug_map.83.d.n13.name=Какие-нибудь крутые сделки с демонами?
adv.debug_map.83.d.n14.name=Этот драгоценный камень имеет много преимуществ, как и я.
adv.debug_map.83.d.n15.name=Я подумаю об этом.
adv.debug_map.83.d.n16.text=Дай мне твое сокровище...\n(+1 здоровье, Манасайт, скорость движения 120%, "Властелин ямы" начинает играть)
adv.debug_map.83.d.n17.name=Есть какие-нибудь причудливые демонические благословения?
adv.debug_map.83.d.n18.name=Это тенево.
adv.debug_map.83.d.n19.name=Что может пойти не так?
adv.debug_map.83.d.n2.text=О, смотрите, у нас тут крутой парень!
adv.debug_map.83.d.n20.text=Розовый. Это цвет моих любимых молочных коктейлей.\n Очень темный и злой.
adv.debug_map.83.d.n21.name=Какой твой любимый цвет?
adv.debug_map.83.d.n22.name=Спасибо, Сатана.
adv.debug_map.83.d.n3.name=Я покорю тебя, демон!
adv.debug_map.83.d.n4.name=Приходите!
adv.debug_map.83.d.n5.text=Ты можешь быть темным и острым, как я. Может быть, для какой-то твоей жизненной силы...
adv.debug_map.83.d.n6.name=Я держу тебя за руку.
adv.debug_map.83.d.n7.name=Не моя жизненная сила, я умру без нее!
adv.debug_map.83.d.n8.name=Я не делаю ничего лучше с этим.
adv.debug_map.83.d.n9.text=У вас нет достаточной жизненной силы... вернитесь с большим количеством, чтобы предложить \n Ешьте здоровую пищу, читайте книгу, получайте эту душу сочной.
adv.debug_map.91.d.n0.text=*glub*\n (По словам вашей Рыбы, он приветствует вас)
adv.debug_map.91.d.n1.name=Глюб.
adv.debug_map.91.d.n2.text=*glub*\n (Ваш цвет теперь синий)
adv.debug_map.91.d.n3.name=Мне нравится твоя рыбалка, я хочу быть синей и пахнуть смешно.
adv.debug_map.91.d.n4.name=Чувак, я могу пойти поесть криля прямо сейчас.
adv.debug_map.91.d.n5.text=*глюб, глюб*\n (Удивительно)
adv.debug_map.91.d.n6.name=Я поговорил с воротами, думаю, ты найдешь это актуальным.
adv.debug_map.91.d.n7.name=Я знаю, да?
adv.emrakul_emrakul.71.d.n0.text=Волшебный красный барьер блокирует путь.
adv.emrakul_emrakul.71.d.n2.text=Ворота не заперты.
adv.emrakul_emrakul.71.d.n3.name=Разблокируйте странный ключ
adv.emrakul_wastetown.69.d.n0.text=Здравствуй, мироходец '{'var=player_name'}'. Эта область ещё в разработке и может измениться. Босс здесь сильный, так что подготовь хорошую колоду.
adv.evilgrove_evilgrove_5_swamp.117.d.n0.text=Надпись гласит: Национальный парк Неверглейдс закрыт для посетителей из-за прибытия нежелательных гостей по периметру парка.
adv.fort_fort_colorless_2_wizards.73.d.n0.text=Полупрозрачное, мерцающее красное поле блокирует ваш путь. Красные крики эхом разносятся по комнате позади вас.
adv.fort_fort_colorless_2_wizards.73.d.n2.text=Барьер исчезает в бесконечности перед вами.
adv.fort_fort_colorless_2_wizards.73.d.n3.name=Положите руку на барьер
adv.graveyard_crypt_crypt.72.d.n0.text=Большой переключатель встроен в стену.
adv.graveyard_crypt_crypt.72.d.n1.text=С севера доносятся громкие звуки.
adv.graveyard_crypt_crypt.72.d.n2.name=Переверните выключатель
adv.graveyard_crypt_crypt.85.d.n0.text=Эти ворота, кажется, заперты на месте каким-то механизмом, но вы не видите здесь никаких элементов управления.
adv.graveyard_crypt_crypt.85.d.n1.name=Пора его найти!
adv.graveyard_crypt_crypt_5.59.d.n0.text=Большой переключатель встроен в стену. Или, был. Кажется, он расплавился, что потребовало бы огромного тепла.
adv.graveyard_crypt_crypt_5.60.d.n0.text=Большой переключатель встроен в стену. Или, был. Кажется, он расплавился, что потребовало бы огромного тепла.
adv.graveyard_crypt_crypt_5.62.d.n0.text=Большой переключатель встроен в стену.
adv.graveyard_crypt_crypt_5.62.d.n1.text=С севера доносятся громкие звуки.
adv.graveyard_crypt_crypt_5.62.d.n2.name=Переверните выключатель
adv.graveyard_crypt_crypt_5.63.d.n0.text=Большой переключатель встроен в стену. Или, был. Кажется, он расплавился, что потребовало бы огромного тепла.
adv.graveyard_crypt_crypt_5.64.d.n0.text=Большой переключатель встроен в стену. Или, был. Кажется, он расплавился, что потребовало бы огромного тепла.
adv.graveyard_crypt_crypt_5.65.d.n0.text=Эти ворота, кажется, заперты на месте каким-то механизмом, но вы не видите здесь никаких элементов управления.
adv.graveyard_crypt_crypt_5.65.d.n1.name=Пора их найти!
adv.graveyard_crypt_crypt_5.66.d.n0.text=Большой переключатель встроен в стену. Или, был. Кажется, он расплавился, что потребовало бы огромного тепла.
adv.graveyard_crypt_crypt_5.67.d.n0.text=Большой переключатель встроен в стену. Или, был. Кажется, он расплавился, что потребовало бы огромного тепла.
adv.graveyard_crypt_crypt_5.79.d.n0.text=Большой переключатель встроен в стену. Или, был. Кажется, он расплавился, что потребовало бы огромного тепла.
adv.grolnok_grolnok_f1.168.d.n0.text=Эта дверь заперта.
adv.grolnok_grolnok_f1.168.d.n2.text=Ворота не заперты.
adv.grolnok_grolnok_f1.168.d.n3.name=Разблокировать ключ Гролнока
adv.grolnok_grolnok_f1.183.d.n0.text=Эта дверь заперта.
adv.grolnok_grolnok_f1.183.d.n2.text=Ворота не заперты.
adv.grolnok_grolnok_f1.183.d.n3.name=Скачать Rusty Old Key
adv.grove_grove_1_bears.86.d.n0.text=Внезапно ты слышишь странные звуки, идущие позади тебя. Грубый голос громит позади тебя: Дорогой мой, ты умрешь!
adv.grove_grove_1_bears.86.d.n1.name=У тебя плохое предчувствие по этому поводу.
adv.grove_grove_8_hydra.114.d.n0.text=Опасный зверь впереди, повернись назад!
adv.horizons.dialog.01114dcc2f54c9bf=И снова здравствуй, мироходец '{'var=player_name'}'!
adv.horizons.dialog.012069092c5f9e96=Но ее разум все еще непостижим.
adv.horizons.dialog.0a4243001f1e34a2=В резком контрасте с лесом позади вас, это кладбище ужасно тихо. Так тихо на самом деле, что вы чувствуете, как будто вы можете услышать легкий гул в воздухе, исходящем от каменной стены вокруг области.
adv.horizons.dialog.0e2bb5f53dda1f00=Связанный механизм вихрем витает к жизни, и скрытая комната на востоке открывается!
adv.horizons.dialog.0e9a8d2cd7e075e9=С севера доносятся громкие звуки.
adv.horizons.dialog.0f80ec1d6d67d928=Она не в состоянии больше бороться. Вы находите кучу сомнительных грибов и немного золота на ней. (+250 золота)
adv.horizons.dialog.13bd16d8cd930c33=Не все растения здоровы, это, кажется, было пережевано животным. Вы даже не уверены, какого цвета был этот цветок.
adv.horizons.dialog.1709960cf500d023=Связанная машина вертится к жизни, и ворота на восток открываются.
adv.horizons.dialog.18b55c00b2464a4b=«...И эти грибы ядовиты, если их давать правильно, но я полагаю, что вы могли бы исцелиться с ними в нужной дозировке». Она на мгновение делает паузу, словно считая, что ей, возможно, придется сделать это самой.
adv.horizons.dialog.1aae20c2bd580b00=Внимательно посмотрите на стену
adv.horizons.dialog.1bad15773c8cbd0b=И я могу помочь ей найти, так что она может помочь тебе в битвах, но ты придешь. '{'var=player_name'}', это будет трудная задача.
adv.horizons.dialog.1bd54d2dddf76b2e=Большой переключатель встроен в стену.
adv.horizons.dialog.1d22fb9df33b3b89=(Продолжить)
adv.horizons.dialog.1f410bc082b80b51=Спасибо за предупреждение.
adv.horizons.dialog.2689367b205c16ce=хорошо
adv.horizons.dialog.276194af82850f4a=Вставить рычаг голема в механизм.
adv.horizons.dialog.2bd275b75b2b5380=Счастливо идти к своей награде
adv.horizons.dialog.2cfbb72b5b4c80ad=Просмотреть предметы
adv.horizons.dialog.2f75c7bf14fe3a21=Присмотритесь поближе к стене.
adv.horizons.dialog.31fbef162594de01=Продолжить
adv.horizons.dialog.361e82b827a07cbf=Хорошо, да, я помню это сейчас.
adv.horizons.dialog.37e1037ccbceb19a=Вы слышите громкие звуки с востока.
adv.horizons.dialog.38b185df0f414493=Может быть, они где-то пригодятся?
adv.horizons.dialog.38eab22280a53ebe=Я Гайбраш Трипвуд, и я хочу быть пиратом!
adv.horizons.dialog.3ce09cf237a83b03=Вы не найдете ничего ценного, кроме большого металлического ключа. Возвращаясь к двери, вы быстро обнаружите, что ключ намного больше замочной скважины для этой двери.
adv.horizons.dialog.3cf93b5bb6ca82f3=Выслушать её
adv.horizons.dialog.3d80a5761e3be7d5=Стражи замков удерживают здесь нескольких мироходцев. Ты тоже в ловушке. Вызови стражей на поединок и одолей их, чтобы мы смогли покинуть этот мир.
adv.horizons.dialog.3d8e90de42c223bb=Она склоняет голову и отскакивает, оставляя свой посох позади.
adv.horizons.dialog.408c162a3d88be60=Ищите источник очарования
adv.horizons.dialog.493ee5f5fd5f87dc=Побежденная, ведьма полностью бросает свой посох, последние ее заклинания срываются. «Подожди... Отпусти меня, и я не буду поднимать тревогу».
adv.horizons.dialog.49e2f2544535c149=Беги!!!
adv.horizons.dialog.4c9784acd455bcb5=Ты отрываешь ключ от холодных, мертвых (и снова мертвых) рук мэра. Теперь, когда он у тебя есть, между тобой и Лилианой не так много.
adv.horizons.dialog.4d5c9cf11585e7d5=Вы чувствуете, что пол начинает грохотать под вашими ногами, когда древние шестерни измельчают друг против друга, но ничего очевидного не происходит.
adv.horizons.dialog.4d7ab3d822206ab3=Постарайтесь отождествить заклинание с одним из ваших
adv.horizons.dialog.4e61c8942e1e563d=Прочитайте табличку
adv.horizons.dialog.550fa1efe820653c=Я Гайбраш Трипвуд, и я как раз ухожу.
adv.horizons.dialog.60ecb8b889804398=* Глаза демона расширяются в страхе.* \n Нет! Я не буду уничтожен к-\n *Окончательный взрыв силы сводит его к мане в воздухе этого места, и что-то хлопает по земле. Священный символ этого места - или, вернее, то, чем оно когда-то было. По мере того, как нечистая энергия вокруг него угасает, вы все еще можете чувствовать магию, пробирающуюся через него.*
adv.horizons.dialog.65b112a67add9cba=Клирик бросает несколько предметов и устремляется к соседнему зданию.
adv.horizons.dialog.6bcf6dcd96446552=Чтобы определить источник звука, не требуется много времени - простирание над стеной - это туманное мерцание очарования, какая-то форма барьера, предназначенная для того, чтобы что-то уберечь от кладбища.
adv.horizons.dialog.6d39a2af8f15bad1=По мере того, как машина рушится на землю в куче деталей, несколько рычагов и шестерен освобождаются от металлического карапака.
adv.horizons.dialog.6dab6d5214d83850=Вы слышите громкие звуки из центра.
adv.horizons.dialog.6fde1e8c81a1e710=Освободите их
adv.horizons.dialog.7d35d8de6c2725aa=«То, что лежит здесь, не может быть изгнано, только содержится. Я стою на страже, чтобы отделить злых духов от их смертных раковин». Кроме текста, есть гравюра ангела и темных духов, сражающихся в небе.
adv.horizons.dialog.808ea11215c74b9b=Найди пленённых мироходцев и приведи их ко мне. Они помогут тебе в пути.
adv.horizons.dialog.8162e3fd8295e10a=Даже такой монстр, как ты, заслуживает пощады.
adv.horizons.dialog.84dd97e8ecce5f37=Возьми эту руну. С ней ты сможешь вернуться сюда в любой момент. Береги себя, мироходец.
adv.horizons.dialog.8569efc4ed5a6273=Спасибо.
adv.horizons.dialog.8f55eb80c34254a7=Подключите передачу от голема к рычагу.
adv.horizons.dialog.9036e5d271df1443=Она берет горсть грибов и раздавливает их в флакон, уже содержащий некоторую неизвестную жидкость. Затем она берет его глоток и медленно помещает его на землю для вас, прежде чем уйти поспешно. (+10 здоровья восстановлено)
adv.horizons.dialog.90eb17f15c5124ac=Ваш противник начинает кричать, когда они возвращаются в каменную форму, но больше не уравновешиваются на пьедестале. Статуя падает и разбивается, а многие части падают в бассейн. Вы почти клянетесь, что слышите крик, слабо продолжающийся под поверхностью воды.
adv.horizons.dialog.9142391ed3ce3fc4=Я Гайбраш Трипвуд, и я хочу быть пожарным!
adv.horizons.dialog.9198cd4576ca2772=Заканчивай.
adv.horizons.dialog.924d085c57ba0969=К алтарю привязана пленница, вокруг нее опоясаны сверкающие красные руны.
adv.horizons.dialog.93ba2e485af8cd54=Нити маны сплетаются в воздухе над стеной и простираются в камень. Любые рыхлые концы нитей, кажется, ведут на северо-восток. Вы также замечаете мягкое очарование на бляшке рядом.
adv.horizons.dialog.94396361b1b2294b=Мэр может держаться от тебя подальше только до того, как тебе удастся прорваться сквозь толпу и добраться до него.
adv.horizons.dialog.94a6145634e6a4f0=Если бы ты знал что-нибудь стоящее, чтобы научить меня прямо, я бы не смог победить тебя.
adv.horizons.dialog.9cf3c709e319d6f5=Мне не нужна власть от такого мерзкого, как ты.
adv.horizons.dialog.a0182875a754682a=Переверните выключатель
adv.horizons.dialog.a06a74fd57bc4a04=Пусть уходит.
adv.horizons.dialog.a10190133fd03ff4=Доверься своему слову
adv.horizons.dialog.a2bef487d018705e=Через мгновение вы чувствуете сдвиг в энергии своего окружения. Эфирная дымка, сопровождавшая заборы кладбища, рассеивается. Формы начинают двигаться у края вашего зрения. Кажется, здесь могло быть что-то истинное о роли опекуна.
adv.horizons.dialog.a53db4c2efacc88d=Ему удается закрыть сложную каменную дверь, прежде чем вы сможете поймать его, и вы слышите серию больших щелчков и сцеплений, когда она запирается, прежде чем вы сможете найти фактическую ручку.
adv.horizons.dialog.a577a9cd2466d2c6=И вот жуткое подтверждение сказки купца, через остатки хвоста мерфолка, оказывается, что здесь действительно был один из водных людей, далекий от своей обычной территории, на которую он никогда не вернется.
adv.horizons.dialog.a5829d51ecc85744=Да, да, победить Лилиану.
adv.horizons.dialog.a6137008eb5c0671=*С рычанием боли демон падает на пол.* \n Поздравляю, смертный, ты одолел меня. В обмен на мою жизнь я предлагаю урок - ту же самую силу убийства, которой я обладаю.
adv.horizons.dialog.a822a488bf87ae0f=Да, да, победить Чандру.
adv.horizons.dialog.a97f758c86c9b10d=Вы освободили из плена легендарного мироходца — Лилиану…
adv.horizons.dialog.aa2aedb59feadb0f=Расследование сцены придется подождать, однако, как оказалось, вы определили причину смерти.Похоже, из ниоткуда, демоны бегут на вас со всех сторон.
adv.horizons.dialog.adbf837cce5ca9f2=Я Гайбраш Трипвуд и продаю эти прекрасные кожаные куртки.
adv.horizons.dialog.b02caf6767bfe998=Нет очевидной точки происхождения заклинания, но вы замечаете табличку, которая стоит отдельно от надгробий вокруг него.
adv.horizons.dialog.b4cc9a18bd3bec45=Вы освободили из плена легендарного мироходца — Чандру…
adv.horizons.dialog.b5cdfdede08884e7=Коллекция передач появляется через остатки этой разрушающейся стены, но рычаг перед вами вращается свободно.
adv.horizons.dialog.b976fcb0602ad141=Это… Шандалар. Здесь мана доступна каждому разумному существу. Даже простые жители каждый день творят заклинания.
adv.horizons.dialog.bd12533fb9a7e41b=Нападение на мэра
adv.horizons.dialog.c0695824368970ed=Прочитайте надпись
adv.horizons.dialog.c3178af591238073=Провода проходят от этого переключателя к ближайшему генератору.
adv.horizons.dialog.c52b71fc3404a86d=(Поиск могилы)
adv.horizons.dialog.c69ff7189524e888=Покинуть район
adv.horizons.dialog.c83601d70f33bfc8=Я приму твое предложение.
adv.horizons.dialog.c9d1c4f74e899dde=Поиск предметов
adv.horizons.dialog.ca39285810d05b94=Погоня за священнослужителем
adv.horizons.dialog.d2cbae3f43e39565=Победа Лилианы, и я могу помочь ей найти, так что она может помочь тебе в битвах, но ты придешь. '{'var=player_name'}', это будет трудная задача.
adv.horizons.dialog.d3ace72bb8357ade=Я сделал, как ты и просил.
adv.horizons.dialog.d493fb4080d7af6d=Фонтан граничит с проходом здесь. Каменная кладка обрублена и грязная, но вода кажется удивительно чистой и прозрачной.
adv.horizons.dialog.d5b38b84b3858d33=Здесь не так много интереса, но вы найдете большой и прочный ключ.
adv.horizons.dialog.d628f64ba4af25ac=(Продолжить)
adv.horizons.dialog.d6f4336637d68c05=К тому времени, как вы доберетесь до здания, оно будет плотно заперто. Ключ, который вы держите, слишком велик для слота.
adv.horizons.dialog.d814972e767f0306=Вы не можете продолжать дальше, мистическая сила толкает вас назад, независимо от того, как сильно вы пытаетесь двигаться вперед, и у вас есть видение ангела в вашем уме, преграждающего ваш путь.
adv.horizons.dialog.d8179e88e449d63f=Так что теперь?
adv.horizons.dialog.ddfb4d8652a8358c=Демон улыбается, двигая рукой тайным жестом. * \n * Когда вы бессознательно имитируете его, вы чувствуете темную, отталкивающую силу, кристаллизующуюся в вашей руке. \n * Демон улыбается, когда он начинает исчезать в облаке дыма. * \n Очень хорошо, смертный. Моя сила - ваша, чтобы владеть ... до следующего раза.
adv.horizons.dialog.e0b2a60b01c87bb7=Надпись гласит: Поздравляем Авантюриста! Только за то, что нашли это место, вы выиграли приз!
adv.horizons.dialog.e1976a36508a1b64=Коллекция шестерен появляется через остатки этой разрушающейся стены, но вы не видите очевидного способа повернуть их.
adv.horizons.dialog.e39da7a4f461c53e=Почему я здесь?
adv.horizons.dialog.e3fe4de30bdc814f=Уходи.
adv.horizons.dialog.f0055b0e48c3c0be=Когда третий пленник освобождается, вы слышите звук разрушения, когда барьер в центре камеры не срабатывает.
adv.horizons.dialog.f67d860edd320454=Погоня за ними.
adv.horizons.dialog.f6a7666b3ba5bb3a=Вы слышите грохот и шум с юга. Последние ворота, кажется, открыты.
adv.horizons.dialog.f84b2209353c1647=И снова здравствуй, мироходец '{'var=player_name'}'!
adv.horizons.dialog.fc6e4a408d56be96=Выход из города
adv.horizons.dialog.fca1718e9d263ef0=Порции за спиной меня ведут к части ее реальности. После того, как вы их активируете, вы можете использовать их для более быстрого путешествия.
adv.item_landscape_sketchbook.n0.text=Вы нашли этот блокнот на месте раскопок.
adv.item_landscape_sketchbook.n1.name=Вы не можете сделать головы или хвосты набросков внутри, но лучше держаться за них.
adv.item_sir_donovans_amulet.n0.text=Амулет остается инертным до тех пор, пока через него не пройдет мана.
adv.item_sir_donovans_amulet.n1.name=Убери амулет.
adv.item_sir_donovans_amulet.n2.name=Свяжитесь с сэром Донованом (требуется 3 Мана Шардс)
adv.item_sir_donovans_amulet.n2.text=Не зная точно, чего ожидать, вы направляете немного энергии из своих собственных осколок маны в амулет. Он светится множеством цветов в течение самых коротких моментов, а затем исчезает.
adv.item_sir_donovans_amulet.n3.text=Мысль приходит в ваш разум в ответ, не столько словами, сколько побуждением — вам следует отправиться в город.
adv.item_sir_donovans_amulet.n4.name=Свяжитесь с сэром Донованом (требуется 5 Мана Шардс)
adv.item_sir_donovans_amulet.n4.text=Вы направляете силу ваших оскоков маны в артефакт, и это требует использования еще нескольких из них, прежде чем устройство реагирует на этот раз, но в конечном итоге оно снова светится в нескольких цветах.
adv.magetower_magetower_14_horrors.102.d.n0.text=Ворота блокируют путь. Похоже, что он открыт откуда-то еще.
adv.magetower_magetower_8_illusion.105.d.n0.text=Судя по царапинам и царапинам на полу, она, кажется, часто открывается, поэтому ключ, вероятно, можно найти поблизости.
adv.magetower_magetower_8_illusion.105.d.n1.name=(Уходите)
adv.magetower_magetower_8_illusion.105.d.n2.text=Дверь открывается, и вы можете продолжить исследовать башню.
adv.magetower_magetower_8_illusion.105.d.n3.name=Откройте ворота ключом иллюзиониста
adv.magetower_wastetown.102.d.n0.text=Ворота блокируют путь. Похоже, что он открыт откуда-то еще.
adv.main_story_castles_black_castle.55.d.n0.text=Вы входите в ворота.
adv.main_story_castles_black_castle.55.d.n1.text=С порывом черного ветра дверь разлетается на тысячи кусочков.
adv.main_story_castles_black_castle.55.d.n2.name=Гризельбранд, я сделал, как ты просил, пора заканчивать!
adv.main_story_castles_black_castle.55.d.n4.text=С порывом черного ветра дверь разлетается на тысячи кусочков.
adv.main_story_castles_black_castle.55.d.n5.name=Гризельбранд, я сделал, как ты просил, пора заканчивать!
adv.main_story_castles_black_castle.55.d.n7.text=Ты не достойна, сдохни!
adv.main_story_castles_black_castle.55.d.n8.name=Ты постучишь в дверь.
adv.main_story_castles_black_castle.73.d.n0.text=Добро пожаловать, '{'var=player_name'}'. Гризельбранд с нетерпением ждал этого момента.
adv.main_story_castles_black_castle.73.d.n1.text=Боюсь, мне не позволено этого делать, я всего лишь слуга могучего Гризельбранда, хозяина Демонов.
adv.main_story_castles_black_castle.73.d.n2.name=Полагаю, ты не против открыть эти ворота передо мной?
adv.main_story_castles_black_castle.73.d.n3.text=Вы должны доказать свою силу, победив, по крайней мере, четырех из пяти врагов, скрывающихся в этом подземелье, чтобы быть достойным аудиенции с моим прославленным мастером.\n Отточить свой клинок, подготовить свои заклинания и собрать свое мужество, ибо предстоящие вызовы проверят меткость даже самого опытного воина.
adv.main_story_castles_black_castle.73.d.n4.name=Что мне нужно сделать, чтобы пройти через эти ворота?
adv.main_story_castles_black_castle.73.d.n6.name=Я покажу свою ценность, только не забудь открыть ворота, когда я победлю твоих соперников.
adv.main_story_castles_black_castle.73.d.n7.text=Претенденты еще живы, вы не пройдете за эти ворота.
adv.main_story_castles_black_castle.73.d.n9.text=Я впечатлен, вы можете встретиться с моим хозяином наверху, хотя я не могу гарантировать, что вы сможете пережить эту встречу.
adv.main_story_castles_black_castle_f1.50.x.n0.text=Когда вы наносите последний удар по Гризельбранду, вы чувствуете значительный пульс маны.
adv.main_story_castles_black_castle_f1.50.x.n2.text=Когда вы наносите последний удар по Гризельбранду, вы чувствуете еще один пульс маны.
adv.main_story_castles_blue_castle.55.d.n0.text=Ты входишь в ворота.
adv.main_story_castles_blue_castle.55.d.n1.text=Внезапно ворота исчезают прямо у тебя на глазах, и ты свободен.
adv.main_story_castles_blue_castle.55.d.n2.name=Лортос, я сделал, как ты просил, пора заканчивать!
adv.main_story_castles_blue_castle.55.d.n4.text=Внезапно ворота исчезают прямо у тебя на глазах, и ты свободен.
adv.main_story_castles_blue_castle.55.d.n5.name=Лортос, я сделал, как ты просил, пора заканчивать!
adv.main_story_castles_blue_castle.55.d.n7.text=Ты не достойна, сдохни!
adv.main_story_castles_blue_castle.55.d.n8.name=Ты постучишь в дверь.
adv.main_story_castles_blue_castle.85.d.n0.text=Добро пожаловать, '{'var=player_name'}'. Лортос с нетерпением ждал этого момента.
adv.main_story_castles_blue_castle.85.d.n1.text=Боюсь, мне не позволено этого делать, я всего лишь слуга могучего Лортоса, хозяин морских глубин.
adv.main_story_castles_blue_castle.85.d.n2.name=Полагаю, ты не против открыть эти ворота передо мной?
adv.main_story_castles_blue_castle.85.d.n3.text=Вы должны доказать свою силу, победив, по крайней мере, четырех из пяти врагов, скрывающихся в этом подземелье, чтобы быть достойным аудиенции с моим прославленным мастером.\n Отточить свой клинок, подготовить свои заклинания и собрать свое мужество, ибо предстоящие вызовы проверят меткость даже самого опытного воина.
adv.main_story_castles_blue_castle.85.d.n4.name=Что мне нужно сделать, чтобы пройти через эти ворота?
adv.main_story_castles_blue_castle.85.d.n6.name=Я покажу свою ценность, только не забудь открыть ворота, когда я победлю твоих соперников.
adv.main_story_castles_blue_castle.85.d.n7.text=Претенденты еще живы, вы не пройдете за эти ворота.
adv.main_story_castles_blue_castle.85.d.n9.text=Я впечатлен, вы можете встретиться с моим хозяином наверху, хотя я не могу гарантировать, что вы сможете пережить эту встречу.
adv.main_story_castles_blue_castle_f1.50.x.n0.text=Когда вы наносите последний удар по Лортосу, вы чувствуете значительный пульс маны, но с устранением непосредственной угрозы теперь вы можете ясно видеть, что запертая комната в северном конце камеры не держит пленных.
adv.main_story_castles_blue_castle_f1.50.x.n2.text=Когда вы наносите последний удар по Лортосу, вы чувствуете еще один пульс маны, но, как и раньше, запертая комната за вашим падшим врагом не держит пленных.
adv.main_story_castles_green_castle.55.d.n0.text=Ты входишь в ворота.
adv.main_story_castles_green_castle.55.d.n1.text=С чрезвычайно громким грохотом ворота открываются, оставляя на вашем пути только пепел.
adv.main_story_castles_green_castle.55.d.n2.name=Галта, я сделал, как ты просила, пора заканчивать!
adv.main_story_castles_green_castle.55.d.n4.text=С чрезвычайно громким грохотом ворота открываются, оставляя на вашем пути только пепел.
adv.main_story_castles_green_castle.55.d.n5.name=Галта, я сделал, как ты просила, пора заканчивать!
adv.main_story_castles_green_castle.55.d.n7.text=Ты не достойна, сдохни!
adv.main_story_castles_green_castle.55.d.n8.name=Ты постучишь в дверь.
adv.main_story_castles_green_castle.72.d.n0.text=Добро пожаловать, '{'var=player_name'}'. Королева Галта с нетерпением ждала этого момента.
adv.main_story_castles_green_castle.72.d.n1.text=Боюсь, мне не позволено это делать, я всего лишь слуга могучей Галты, царицы динозавров.
adv.main_story_castles_green_castle.72.d.n2.name=Полагаю, ты не против открыть эти ворота передо мной?
adv.main_story_castles_green_castle.72.d.n3.text=Вы должны доказать свою силу, победив, по крайней мере, четырех из пяти врагов, скрывающихся в этом подземелье, чтобы быть достойным аудиенции с моим прославленным мастером, который имеет власть над этим царством динозавров.\n Оттачивайте свой клинок, готовьте свои заклинания и собирайте свое мужество, ибо предстоящие вызовы проверят меткость даже самого опытного воина.
adv.main_story_castles_green_castle.72.d.n4.name=Что мне нужно сделать, чтобы пройти через эти ворота?
adv.main_story_castles_green_castle.72.d.n6.name=Я покажу свою ценность, только не забудь открыть ворота, когда я победлю твоих соперников.
adv.main_story_castles_green_castle.72.d.n7.text=Претенденты еще живы, вы не пройдете за эти ворота.
adv.main_story_castles_green_castle.72.d.n9.text=Я впечатлен, вы можете встретиться с моим хозяином наверху, хотя я не могу гарантировать, что вы сможете пережить эту встречу.
adv.main_story_castles_green_castle_f1.52.x.n0.text=Когда вы наносите последний удар по Галте, вы чувствуете значительный пульс маны.
adv.main_story_castles_green_castle_f1.52.x.n2.text=Когда вы наносите последний удар по Галте, вы чувствуете еще один пульс маны.
adv.main_story_castles_red_castle.55.d.n0.text=Ты входишь в ворота.
adv.main_story_castles_red_castle.55.d.n1.text=С порывом красного пламени дверь сгорает, оставляя на вашем пути только пепел.
adv.main_story_castles_red_castle.55.d.n2.name=Латлисс, я сделал, как ты просил, пора заканчивать!
adv.main_story_castles_red_castle.55.d.n4.text=С порывом красного пламени дверь сгорает, оставляя на вашем пути только пепел.
adv.main_story_castles_red_castle.55.d.n5.name=Латлисс, я сделал, как ты просил, пора заканчивать!
adv.main_story_castles_red_castle.55.d.n7.text=Ты не достойна, сдохни!
adv.main_story_castles_red_castle.55.d.n8.name=Ты постучишь в дверь.
adv.main_story_castles_red_castle.72.d.n0.text=Добро пожаловать, '{'var=player_name'}'. Латлисс с нетерпением ждал этого момента.
adv.main_story_castles_red_castle.72.d.n1.text=Боюсь, мне не позволено это делать, я всего лишь обычный дракон, простой слуга могучей Латлисс, царицы драконов.
adv.main_story_castles_red_castle.72.d.n2.name=Полагаю, ты не против открыть эти ворота передо мной?
adv.main_story_castles_red_castle.72.d.n3.text=Вы должны доказать свою силу, победив, по крайней мере, четырех из пяти врагов, скрывающихся в этом подземелье, чтобы быть достойным аудиенции с моим прославленным мастером.\n Отточить свой клинок, подготовить свои заклинания и собрать свое мужество, ибо предстоящие вызовы проверят меткость даже самого опытного воина.
adv.main_story_castles_red_castle.72.d.n4.name=Что мне нужно сделать, чтобы пройти через эти ворота?
adv.main_story_castles_red_castle.72.d.n6.name=Я покажу свою ценность, только не забудь открыть ворота, когда я победлю твоих соперников.
adv.main_story_castles_red_castle.72.d.n7.text=Претенденты еще живы, вы не пройдете за эти ворота.
adv.main_story_castles_red_castle.72.d.n9.text=Я впечатлен, вы можете встретиться с моим хозяином наверху, хотя я не могу гарантировать, что вы сможете пережить эту встречу.
adv.main_story_castles_red_castle_f1.52.x.n0.text=Когда вы наносите последний удар по Латлиссу, вы чувствуете значительный пульс маны.
adv.main_story_castles_red_castle_f1.52.x.n2.text=Когда вы наносите последний удар по Латлиссу, вы чувствуете еще один пульс маны.
adv.main_story_castles_red_castle_f1.56.x.n0.text=Когда вы наносите последний удар по Латлиссу, вы чувствуете значительный пульс маны.
adv.main_story_castles_red_castle_f1.56.x.n2.text=Когда вы наносите последний удар по Латлиссу, вы чувствуете еще один пульс маны.
adv.main_story_castles_wastetown.55.d.n0.text=Большие ворота блокируют путь.
adv.main_story_castles_wastetown.55.d.n2.text=Ворота открываются
adv.main_story_castles_wastetown.55.d.n3.name=Разблокируйте пять цветных ключей.
adv.main_story_castles_white_castle.55.d.n0.text=Ты входишь в ворота.
adv.main_story_castles_white_castle.55.d.n1.text=С чрезвычайно громким взрывом ворота распахнулись, оставив на вашем пути только пепел.
adv.main_story_castles_white_castle.55.d.n2.name=Акрома, я сделал, как ты просил, пора заканчивать!
adv.main_story_castles_white_castle.55.d.n4.text=С чрезвычайно громким взрывом ворота распахнулись, оставив на вашем пути только пепел.
adv.main_story_castles_white_castle.55.d.n5.name=Акрома, я сделал, как ты просил, пора заканчивать!
adv.main_story_castles_white_castle.55.d.n7.text=Ты не достойна, сдохни!
adv.main_story_castles_white_castle.55.d.n8.name=Ты постучишь в дверь.
adv.main_story_castles_white_castle.74.d.n0.text=Добро пожаловать, '{'var=player_name'}'. Акрома с нетерпением ждал этого момента.
adv.main_story_castles_white_castle.74.d.n1.text=Боюсь, мне не позволено этого делать, я всего лишь слуга могучего Акрома, правителя Ангелов.
adv.main_story_castles_white_castle.74.d.n2.name=Полагаю, ты не против открыть эти ворота передо мной?
adv.main_story_castles_white_castle.74.d.n3.text=Вы должны доказать свою силу, победив, по крайней мере, четырех из пяти врагов, скрывающихся в этом подземелье, чтобы быть достойным аудиенции с моим прославленным мастером.\n Отточить свой клинок, подготовить свои заклинания и собрать свое мужество, ибо предстоящие вызовы проверят меткость даже самого опытного воина.
adv.main_story_castles_white_castle.74.d.n4.name=Что мне нужно сделать, чтобы пройти через эти ворота?
adv.main_story_castles_white_castle.74.d.n6.name=Я покажу свою ценность, только не забудь открыть ворота, когда я победлю твоих соперников.
adv.main_story_castles_white_castle.74.d.n7.text=Претенденты еще живы, вы не пройдете за эти ворота.
adv.main_story_castles_white_castle.74.d.n9.text=Действительно, я впечатлен, вы можете встретиться с моим хозяином наверху, хотя я не могу гарантировать, что вы сможете пережить эту встречу.
adv.main_story_castles_white_castle_f1.50.x.n0.text=Когда вы наносите последний удар по Акроме, вы чувствуете значительный пульс маны. Но с немедленной устраненной угрозой теперь вы можете ясно видеть, что запертая комната в северном конце камеры не держит пленных.
adv.main_story_castles_white_castle_f1.50.x.n2.text=Когда вы наносите последний удар по Акроме, вы чувствуете еще один пульс маны, но, как и раньше, запертая комната за вашим падшим врагом не держит пленных.
adv.main_story_defend_waste_town_abandoned.76.d.n0.text=Один из немногих звуков в этом районе, водяное колесо на этой старой мельнице скрипит, когда она постепенно вращается в медленно движущейся и странно окрашенной воде.
adv.main_story_defend_waste_town_abandoned.77.d.n0.text=Эти магазины так же безжизненны, как и остальная часть города, но кажется, что некоторые предметы остались, подозрительно нетронутыми.
adv.main_story_defend_waste_town_abandoned.78.d.n0.text=В гостинице плотно заперта. В мэрии, напротив, отсутствует входная дверь, но вы ничего не найдете внутри, просто хорошо организованные рушащиеся бумаги, зажатые неопровержимо размазанными чернилами.
adv.main_story_defend_waste_town_abandoned.79.d.n0.text=Лозы, покрывающие эти дома, выглядят болезненно, как будто они ищут пропитание, не найденное в почве здесь.
adv.main_story_defend_waste_town_abandoned.82.d.n0.text="Смертельный покой" кажется подходящим описанием для кладбища. Вы обнаруживаете, что почти хотите, чтобы мертвые воскресли просто для того, чтобы что-то случилось.
adv.main_story_defend_waste_town_abandoned.83.d.n0.text=Как описывал торговец, за этими воротами лежит пустой город, даже ветер здесь кажется более спокойным, как будто боясь что-то потревожить.
adv.main_story_defend_waste_town_abandoned.83.d.n1.text=По мере приближения становится очевидным, что большинство зданий не повреждены, но находятся в аварийном состоянии или прямо заросли.Сомнительно, чтобы кто-то жил здесь довольно долго.
adv.main_story_defend_waste_town_abandoned.83.d.n3.name=Пора отправляться на охоту за порталом. Не думаю, что могу кого-то спросить о направлениях...
adv.main_story_defend_waste_town_abandoned.94.d.n0.text=Возможно, это просто трюк ума, вы не можете поколебать чувство, что за вами наблюдают, когда вы исследуете область.
adv.main_story_explore_dig_site_0.61.d.n0.text=Я просто был здесь, чтобы забрать некоторые части старой техники. Я не ожидал, что они попытаются забрать меня. Но, по крайней мере, на этот раз это были не змеи...
adv.main_story_explore_dig_site_1.116.d.n0.text=Рычаг чувствует себя прочно прикрепленным к выключателю, но он свободно качается туда-сюда, как будто с этим механизмом ничего не связано.
adv.main_story_explore_frostbitten_cavern_0.30.d.n0.text=К счастью для вас, а также, возможно, обитателей этой пещеры, ворота заморожены, а не закрыты.
adv.main_story_explore_frostbitten_cavern_1.19.d.n0.text=Цветы растут, или пытаются, во всех уголках пещеры.Сталактиты льда усеивают ярко-белую крышу пещеры, как люстра, и здесь намного теплее, чем вы ожидали.
adv.main_story_explore_frostbitten_cavern_1.25.d.n0.text=Этот цветок имеет очень богатый фиолетовый оттенок.
adv.main_story_explore_frostbitten_cavern_1.25.d.n1.name=Возьми цветок
adv.main_story_explore_frostbitten_cavern_1.26.d.n0.text=Этот цветок очень романтичный оттенок алого.
adv.main_story_explore_frostbitten_cavern_1.26.d.n1.name=Возьми цветок
adv.main_story_explore_frostbitten_cavern_1.8.d.n0.text=Маг в самом сердце пещеры рычит на вас: «Если мои спутники не оказали вам достаточно холодного гостеприимства, позвольте мне...»
adv.main_story_explore_frostbitten_cavern_1.8.d.n1.text="Нет, теперь с тобой покончено.
adv.main_story_explore_frostbitten_cavern_1.8.d.n2.name=Мне просто нужен один из этих цветов.
adv.main_story_explore_frostbitten_cavern_1.8.d.n3.name=(Борьба)
adv.main_story_explore_frostbitten_cavern_1.8.d.n4.name=(Бегство)
adv.main_story_explore_frostbitten_cavern_1.8.d.n5.name=(Борьба)
adv.main_story_explore_frostbitten_cavern_1.8.d.n6.name=(Бегство)
adv.main_story_explore_library_of_varsil_1.25.d.n0.text=Анатомические исследования различных мирских животных найдены на этой полке. Открытый сверху текст о змеях. Почему это должны быть змеи?
adv.main_story_explore_library_of_varsil_1.26.d.n0.text=Эта полка содержит книги рецептов, но многие ингредиенты вам незнакомы.
adv.main_story_explore_library_of_varsil_1.27.d.n0.text=Здесь вы найдете не столько книги, сколько коллекции документов. Она, по-видимому, состоит из серии караванных манифестов и судовых регистров, прикрепленных к картам. Комментарии и вопросы, начертанные на наборе календарей, указывают на то, что тот, кто собрал эти записи, подозревал, что связанные с ними торговцы часто вели дополнительные незарегистрированные дела по своим маршрутам.
adv.main_story_explore_library_of_varsil_1.28.d.n0.text=«Влияние персональной телепортации на межгородскую торговлю» — не совсем похоже на перелистывание страниц.
adv.main_story_explore_library_of_varsil_1.30.d.n0.text=Какие бы знания ни содержались в этих текстах, они теряются, их страницы уже давно пропитаны той же темной жидкостью, которая, по-видимому, окрашивала полки под ними.
adv.main_story_explore_library_of_varsil_1.31.d.n0.text=Пылевые томы неописуемых предметов заполняют эту полку. Вы чувствуете, что они не тронуты уже довольно долгое время.
adv.main_story_explore_library_of_varsil_1.32.d.n0.text=Эта полка содержит журнал с прочной обложкой, которая стоит отдельно от выцветших свитков вокруг него. Записи для вас загадка, однако, так как они написаны в какой-то форме кода.
adv.main_story_explore_library_of_varsil_1.33.d.n0.text="Азготские стихи из летнего утра". Эта книга вызывает у вас жуткое чувство, и вы мудро оставляете обложку закрытой.
adv.main_story_explore_library_of_varsil_1.34.d.n0.text=Здесь вы найдете коллекцию биографий волшебников, о которых вы никогда не слышали, и быстрый просмотр содержимого заставляет вас задуматься, кто бы потрудился написать их.
adv.main_story_explore_library_of_varsil_1.35.d.n0.text=Коллекция детских рисунков заполняет этот книжный шкаф, хотя в отличие от большинства подобных коллекций все они, кажется, изображают тайные предметы.
adv.main_story_explore_library_of_varsil_1.36.d.n0.text=Здесь вы найдете чертеж самой библиотеки. К сожалению, похоже, нет никакого списка секретных отрывков, которыми можно было бы воспользоваться.
adv.main_story_explore_library_of_varsil_2.26.d.n0.text=«Празднование Безумного Шута» представлено как вымышленная история о человеке по имени Кутман, чьи тщательно детализированные рассказы о причудливых мирах подняли его статус от нищего до королевского артиста, прежде чем его утащили демоны посреди королевского двора, которые не причинили вреда другой душе.
adv.main_story_explore_library_of_varsil_2.26.d.n1.text=Эта копия предваряется, однако, заметками писца о том, что все исторические фигуры в тексте заметки и их взаимодействия, по-видимому, чрезвычайно точно изображены, ставя под сомнение вымышленное происхождение рассказа Кутмана.
adv.main_story_explore_library_of_varsil_2.27.d.n0.text=Эта полка - просто куча страниц, которые, кажется, не связаны между собой различными книгами по всей библиотеке. Вы не видите среди них ничего особенно важного.
adv.main_story_explore_library_of_varsil_2.28.d.n0.text=«Волшебная метеорология», «Разрушительная сила небес» — все эти книги, кажется, сосредоточены на вещах, падающих с неба.
adv.main_story_explore_library_of_varsil_2.29.d.n0.text=«Справка с магическими нарушениями» описывает трудности в сообществах Шандаларов, позволяющие людям без магического таланта чувствовать себя полноценными членами общества.
adv.main_story_explore_library_of_varsil_2.30.d.n0.text=На этой полке лежит куча детских книг. Самая верхняя рассказывает историю о бригаде воздушных шаров Гоблина, члены которой не имеют имен и все обращаются друг к другу как «Тупой, чем Х», где X равен числу их сверстников, которые согласились быть умнее в тот день.
adv.main_story_explore_library_of_varsil_2.31.d.n0.text=Отчеты о генеалогии и данные переписи охватывают этот книжный шкаф. Понятно, что они довольно пыльные, что делает еще более очевидным то, что несколько книг были недавно удалены.
adv.main_story_explore_library_of_varsil_2.32.d.n0.text=Одна страница отмечена сложенным углом и описывает тип Эльфа, которого вы нигде не видели на Шандаларе.
adv.main_story_explore_library_of_varsil_2.34.d.n0.text=«Исторический рассказ о прибрежном рейде» — это сборник интервью, проведенных с выжившими в прибрежной рыбацкой деревне, которая была разграблена неизвестными существами, которые просто вышли из моря.
adv.main_story_explore_library_of_varsil_2.35.d.n0.text=Коллекция работ о Мана Шардс - от теорий о том, как они поглощают ману, будучи похороненными под землей, до причудливых рисунков, таких как зерновая мельница, функционирующая рядом с сухим руслом реки и питаемая осколками.
adv.main_story_explore_library_of_varsil_2.36.d.n0.text="Цена магии" фокусируется не на прямом воздействии заклинаний, а на стоимости и последствиях их литья.
adv.main_story_explore_library_of_varsil_2.38.d.n0.text=«Пропавшая рысь» представляется биологическим и поведенческим сравнением одомашненных кошек и Леонина.В тексте положены различные теории, с выводом, что та или иная была результатом неправильного применения исследований древнего волшебника.
adv.main_story_explore_library_of_varsil_3.26.d.n0.text="Самые горючие города Шандалаара". Ну, этот звучит как легкое чтение...
adv.main_story_explore_library_of_varsil_3.27.d.n0.text=Здесь вы найдете коллекцию биографий волшебников, о которых вы никогда не слышали. Ни один из них, кажется, не сделал ничего значительного.
adv.main_story_explore_library_of_varsil_3.28.d.n0.text=Здесь встречаются дневники солдат, все из одного и того же периода времени, но из нескольких армий, между которыми, по-видимому, можно было бы составить исчерпывающий отчет об общих сражениях.
adv.main_story_explore_library_of_varsil_3.30.d.n0.text=«Искусство тонкого контрпелля» очень полезно для чтения, если у вас есть время для этого.
adv.main_story_explore_library_of_varsil_3.31.d.n0.text=Здесь собраны журналы караванных манифестов.Содержимое все кажется обыденным, но кто-то обвел вокруг себя несколько предметов и нацарапал заметки почерком так беспорядочно, что оно в основном неразборчиво.
adv.main_story_explore_library_of_varsil_3.32.d.n0.text=«Быть отчетом о срочной угрозе всем цивилизованным народам» — довольно красноречивое название для скаутского доклада, но это то, что вы найдете здесь.
adv.main_story_explore_library_of_varsil_3.32.d.n1.text=В докладе, относительно недавнем по меркам этой библиотеки, описывается улей Слайвера, который затмевает крупнейшие города Шандалара. Он включает в себя подробную карту местоположения.
adv.main_story_explore_library_of_varsil_3.32.d.n3.name=(Опустить отчет)
adv.main_story_explore_library_of_varsil_3.32.d.n4.text=Отметьте местоположение Скепа на своей карте, если вы решите исследовать его позже.
adv.main_story_explore_library_of_varsil_3.32.d.n5.name=Может быть, он все еще там? Давайте сделаем заметку о месте.
adv.main_story_explore_library_of_varsil_3.34.d.n0.text=Здесь вы найдете коллекцию биографий волшебников, о которых вы никогда не слышали. Ни один из них, кажется, не сделал ничего значительного.
adv.main_story_explore_library_of_varsil_3.35.d.n0.text=Здесь вы найдете коллекцию скопированных планов для различных изобретений гоблинов. Переводчик добавил заметки рядом с каждым рейтингом по шкале между «Определенно взорвется» и «Не будет работать достаточно хорошо, чтобы взорваться».
adv.main_story_explore_library_of_varsil_3.36.d.n0.text=«Как приручить своего барсука» Гринслеева... Что смешнее, предмет или псевдоним?
adv.main_story_explore_library_of_varsil_3.37.d.n0.text="Пардическая жара" - это, из всего, что можно найти здесь, роман, рассказывающий о разжигании огня между магами, скрещивающимися со звездами.
adv.main_story_explore_library_of_varsil_3.50.d.n0.text=«Обычные формы мимики» были бы довольно полезной книгой для чтения, если бы она не пыталась съесть вас.
adv.main_story_explore_library_of_varsil_3.51.d.n0.text=«...S35 настаивал на том, чтобы его не вызывали ранее. Однако после начала седьмого этапа S35 проявлял уменьшенные признаки болезни и, по-видимому, по крайней мере подсознательно предвосхищал опасность, приближающуюся к двенадцатой стадии, как только мы вызвали S36 к ...»
adv.main_story_explore_library_of_varsil_3.51.d.n1.text=Похоже, это исследование, которое вы искали.
adv.main_story_explore_library_of_varsil_3.51.d.n3.text=Здесь, вероятно, можно найти еще что-то, но у вас есть то, о чем просил сэр Донован, и вы можете оставить путь, по которому пришли.
adv.main_story_explore_library_of_varsil_3.51.d.n4.name=Возьмите документы
adv.main_story_explore_library_of_varsil_3.51.d.n6.text=С массивным мехом наверху, уже побежденным, твоя работа здесь закончена.
adv.main_story_explore_library_of_varsil_3.51.d.n7.name=Возьмите документы
adv.main_story_explore_library_of_varsil_4.27.x.n0.text=С этой чудовищной машиной, которая вышла из строя, победив своих (относительно) меньших компаньонов, можно было бы оставить меньшим авантюристам, но вы все еще не нашли документы, которые хотел сэр Донован.
adv.main_story_explore_library_of_varsil_4.27.x.n2.text=С этой чудовищной машиной, которая вышла из строя, победив своих (относительно) меньших компаньонов, вы уже нашли документы, которые хотел сэр Донован, и можете сообщить ему сейчас или вернуться вниз и исследовать дальше.
adv.main_story_explore_library_of_varsil_4.28.x.n0.text=С этой чудовищной машиной, которая вышла из строя, победив своих (относительно) меньших компаньонов, можно было бы оставить меньшим авантюристам, но вы все еще не нашли документы, которые хотел сэр Донован.
adv.main_story_explore_library_of_varsil_4.28.x.n2.text=С этой чудовищной машиной, которая вышла из строя, победив своих (относительно) меньших компаньонов, вы уже нашли документы, которые хотел сэр Донован, и можете сообщить ему сейчас или вернуться вниз и исследовать дальше.
adv.main_story_explore_library_of_varsil_4.29.x.n0.text=С этой чудовищной машиной, которая вышла из строя, победив своих (относительно) меньших компаньонов, можно было бы оставить меньшим авантюристам, но вы все еще не нашли документы, которые хотел сэр Донован.
adv.main_story_explore_library_of_varsil_4.29.x.n2.text=С этой чудовищной машиной, которая вышла из строя, победив своих (относительно) меньших компаньонов, вы уже нашли документы, которые хотел сэр Донован, и можете сообщить ему сейчас или вернуться вниз и исследовать дальше.
adv.main_story_explore_library_of_varsil_4.33.d.n0.text=Если и есть какая-то информация, собранная с разорванных страниц, нагроможденных на этом этаже, это будет зависеть от ученых, которые могли бы иметь некоторую память о том, что они были. Но когда вы приближаетесь, портал здесь открывается, обеспечивая быстрый маршрут обратно к входу.
adv.main_story_explore_library_of_varsil_4.35.d.n0.text=Перед вами стоит одна из самых больших конструкций, которые вы когда-либо видели. В отличие от големов ниже, ее форма, кажется, меньше смоделирована по сравнению с другими гуманоидами и более уникальная форма.
adv.main_story_explore_library_of_varsil_4.35.d.n1.text=За машиной вы видите остатки многих книг, вытащенных с полок внизу, теперь разорванных на части.
adv.main_story_explore_library_of_varsil_4.35.d.n3.text=(Примечание: эта встреча является сложной и необязательной)
adv.main_story_plains_capital.64.d.n0.text=Здравствуйте, вам здесь нечего делать...\n Пока.
adv.main_story_spawn.69.d.n0.text=Здравствуй, мироходец '{'var=player_name'}'.
adv.main_story_spawn.69.d.n1.text=Это… Шандалар. Здесь мана доступна каждому разумному существу. Даже простые жители каждый день творят заклинания.
adv.main_story_spawn.69.d.n11.text=Это монеты испытаний. Чародеи Шандалара часто собираются, чтобы помериться силами. С такой монетой тебя допустят к состязанию, а выигранные призы пригодятся в пути.
adv.main_story_spawn.69.d.n12.name=Тогда для чего они нужны?
adv.main_story_spawn.69.d.n13.text=Покажи монету трактирщику. Если в городе проходят состязания, он подскажет, где найти участников.
adv.main_story_spawn.69.d.n14.name=Где эти конкурсы?
adv.main_story_spawn.69.d.n15.text=Сейчас я снова открою портал, через который ты сюда попал. Вернуть тебя домой он не сможет. По ту сторону лежат пустоши Шандалара. Это мой дом, а теперь и твой.
adv.main_story_spawn.69.d.n16.name=Спасибо.
adv.main_story_spawn.69.d.n17.name=(Уходите)
adv.main_story_spawn.69.d.n18.text=Сейчас я снова открою портал, через который ты сюда попал. Вернуть тебя домой он не сможет. По ту сторону лежат пустоши Шандалара. Это мой дом, а теперь и твой.
adv.main_story_spawn.69.d.n19.name=Спасибо.
adv.main_story_spawn.69.d.n2.name=Почему я здесь?
adv.main_story_spawn.69.d.n20.name=(Уходите)
adv.main_story_spawn.69.d.n21.name=До свидания.
adv.main_story_spawn.69.d.n22.text="'{'var=player_name'}'! Я чувствую, что заклинание Стражей становится все слабее! Победите их всех, и вы можете спасти нас еще".
adv.main_story_spawn.69.d.n23.name="Прощай".
adv.main_story_spawn.69.d.n24.text="Хорошо снова видеть тебя '{'var=player_name'}'. Я так понимаю, что ты добился успеха в своих поисках?"
adv.main_story_spawn.69.d.n25.text=Полагаю, я должен был бы объяснить дальше. Стражи, которых вы победили, не были похитителями, не напрямую. Но их простое присутствие имело последствия, изменяющие мир.
adv.main_story_spawn.69.d.n26.name=Я победил оккупантов пяти замков, но пленных я не нашел.
adv.main_story_spawn.69.d.n27.text=Вы, вероятно, видели очень целенаправленную версию последствий их присутствия в своих замках, но они также окутывали определенные районы нашего мира, заставляя их быть ... скрытыми, из-за отсутствия лучшего термина.
adv.main_story_spawn.69.d.n28.name=«Такие эффекты, как что?»
adv.main_story_spawn.69.d.n29.text=Присутствие стражей породило чары, отводившие взгляд от целых областей нашего мира. Они скрывали и темницы, где держат мироходцев. Думаю, теперь тебе удастся их найти…
adv.main_story_spawn.69.d.n3.text=Стражи замков удерживают здесь нескольких мироходцев. Ты тоже в ловушке. Вызови стражей на поединок и одолей их, чтобы мы смогли покинуть этот мир.
adv.main_story_spawn.69.d.n31.text=[RED]От разработчиков.[] На этом пока заканчивается основная история. На карте Шандалара открылись новые сложные подземелья, и ты можешь продолжать собирать карты.
adv.main_story_spawn.69.d.n33.text=[RED]От разработчиков.[] После обновления Forge поговори с этим персонажем снова. О продолжении истории мы сообщим в Discord. Спасибо, что отправились в это приключение вместе с нами!
adv.main_story_spawn.69.d.n35.name=(Глава 1 полная)
adv.main_story_spawn.69.d.n36.text=Снова привет
adv.main_story_spawn.69.d.n37.name=Я хочу обменять пять цветных ключей на мокс по моему выбору и ключ от комнаты Эмракула.
adv.main_story_spawn.69.d.n5.text=Найди пленённых мироходцев и приведи их ко мне. Они помогут тебе в пути.
adv.main_story_spawn.69.d.n7.text=Возьми эту руну. С ней ты сможешь вернуться сюда в любой момент. Береги себя, мироходец.
adv.main_story_spawn.69.d.n9.text=У меня есть для тебя ещё кое-что, '{'var=player_name'}'. Возьми эти монеты. Прибереги их для состязаний.
adv.main_story_temple_of_gideon_graveyard.256.d.n0.text=На краю отражающего бассейна стоит резной камень с изображением ангела, который как будто сражается в полете, воздух вокруг меча и щита статуи мерцает призматической дымкой. В другой обстановке это было бы величественно. Но здесь это зловеще.
adv.main_story_temple_of_gideon_graveyard.256.d.n10.text=После того, как статуя была разрушена, вы больше не чувствуете тяжелого присутствия, которое вы чувствовали до этого, которое оттолкнуло вас от границ кладбища.
adv.main_story_temple_of_gideon_graveyard.256.d.n11.name=Ищите выход
adv.main_story_temple_of_gideon_graveyard.256.d.n2.text=Вы также начинаете замечать, что многие из знакомых священных символов, выгравированных вокруг основания, скручены, неполны, изменены или иным образом кажутся «неправильными».
adv.main_story_temple_of_gideon_graveyard.256.d.n3.name=Внимательно посмотрите на статую
adv.main_story_temple_of_gideon_graveyard.256.d.n5.text=Что бы вы ни делали, это, кажется, работает. Сияние вокруг оружия статуи начинает рассеиваться, как и барьер вокруг кладбища. Вы также обнаружите, что можете направить эту энергию и чувствовать себя несколько освеженным ею. (+15 здоровья восстановлено)
adv.main_story_temple_of_gideon_graveyard.256.d.n6.name=Уменьшите силу статуи
adv.main_story_temple_of_gideon_graveyard.256.d.n7.text=Статуя начинает трескаться и смещаться, но не рушится. Вместо этого она говорит: «ВЫ ВЗАИМОСТИ С ВЛАСТЬЮ, КОТОРЫЕ НЕ ЗНАЕТЕ, СМЕРТИВНЫЕ!!» У вас мало времени, чтобы обработать это, прежде чем она нападет!
adv.main_story_temple_of_gideon_steppe.237.d.n0.text=Вы входите в ворота.
adv.main_story_temple_of_gideon_steppe.237.d.n1.text=С порывом красного пламени дверь сгорает, оставляя на вашем пути только пепел.
adv.main_story_temple_of_gideon_steppe.237.d.n2.name=Латлисс, пора покончить с этим!
adv.main_story_temple_of_gideon_steppe.237.d.n4.text=Ты не достойна, сдохни!
adv.main_story_temple_of_gideon_steppe.237.d.n5.name=Ты постучалась в дверь
adv.main_story_temple_of_gideon_steppe.240.d.n0.text=Старый крон на тебя прохожий, но не поднимает свой посох, чтобы напасть.
adv.main_story_temple_of_gideon_steppe.240.d.n2.name=Напасть на ведьму
adv.main_story_temple_of_gideon_steppe.240.d.n3.text=«Уходи с собой! Их у тебя не будет!» Она отступает, сбрасывая какие-то травы и грибы, которые она, похоже, собирала.
adv.main_story_temple_of_gideon_steppe.240.d.n4.name=Медленно приближайтесь к ней
adv.main_story_temple_of_gideon_steppe.240.d.n6.name=Напасть на ведьму
adv.main_story_temple_of_gideon_town.188.x.n0.text=Маркировка аллеи как проверено
adv.main_story_temple_of_gideon_town.188.x.n2.text=Мэр, похоже, не в переулках.
adv.main_story_temple_of_gideon_town.188.x.n4.text=Обыскав большую часть города, вы все еще не нашли мэра, но, оглядываясь назад в этом направлении, вы, наконец, замечаете их на улице.
adv.main_story_temple_of_gideon_town.192.x.n0.text=Маркировка доков как проверенных
adv.main_story_temple_of_gideon_town.192.x.n2.text=Мэр, похоже, не в доках.
adv.main_story_temple_of_gideon_town.192.x.n4.text=Обыскав большую часть города, вы все еще не нашли мэра, но, оглядываясь назад в этом направлении, вы, наконец, замечаете их на улице.
adv.main_story_temple_of_gideon_town.193.x.n0.text=Маркировка склада в соответствии с проверкой
adv.main_story_temple_of_gideon_town.193.x.n2.text=Мэр, похоже, не на складе.
adv.main_story_temple_of_gideon_town.193.x.n4.text=Обыскав большую часть города, вы все еще не нашли мэра, но, оглядываясь назад в этом направлении, вы, наконец, замечаете их на улице.
adv.main_story_temple_of_gideon_town.194.x.n0.text=Пометить храм как проверенный
adv.main_story_temple_of_gideon_town.194.x.n2.text=Мэр, похоже, не в храме.
adv.main_story_temple_of_gideon_town.194.x.n4.text=Обыскав большую часть города, вы все еще не нашли мэра, но, оглядываясь назад в этом направлении, вы, наконец, замечаете их на улице.
adv.main_story_temple_of_gideon_town.2.x.n0.text=Маркировка улицы как проверено
adv.main_story_temple_of_gideon_town.2.x.n2.text=Мэр не выходит на главную дорогу через город.
adv.main_story_temple_of_gideon_town.2.x.n4.text=Обыскав большую часть города, вы все еще не нашли мэра, но, оглядываясь назад в этом направлении, вы, наконец, замечаете их в конце улицы.
