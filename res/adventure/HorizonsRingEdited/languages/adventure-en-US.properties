adv.vampirecastle_vampirecastle_grave_2.98.d.n7.name=Хватай добычу из пустого гроба.
adv.vampirecastle_vampirecastle_grave_2.99.d.n0.text=Вы подходите к гробу, покрытому паутиной, лежащему в центре комнаты.
adv.vampirecastle_vampirecastle_grave_2.99.d.n2.text=Вы ощущаете огромное количество энергии, излучаемой из гроба. Вы также начинаете отмечать различные нечестивые символы, выгравированные вокруг основания гроба.
adv.vampirecastle_vampirecastle_grave_2.99.d.n3.name=Внимательно посмотрите на ржавый гроб
adv.vampirecastle_vampirecastle_grave_2.99.d.n5.text=Когда вы открываете гроб, ожидая, что из него выйдет древнее зло, вы понимаете, что это чувство было только вашим воображением.
adv.vampirecastle_vampirecastle_grave_2.99.d.n6.name=Откройте гроб.
adv.vampirecastle_vampirecastle_grave_2.99.d.n7.name=Хватай добычу из пустого гроба.
adv.vampirecastle_vampirecastle_grave_3.66.d.n0.text=Прозрачное, мерцающее красное поле блокирует ваш путь.В этих склепах скрывается древнее зло, мешающее вам войти в комнату перед вами...
adv.vampirecastle_vampirecastle_grave_3.67.d.n0.text=Вы видите гроб, лежащий в центре склепа. Эта реликвия вампирской истории, когда-то сосуд для бессмертных, теперь стояла как изношенное временем свидетельство о прохождении веков, молчаливое свидетельство тайн и теней, которые развернулись в его пределах. Древний гроб, хранилище веков, источал ауру как угрозы, так и меланхолии, молчаливый часовой к тайнам ночного царства.
adv.vampirecastle_vampirecastle_grave_3.67.d.n2.text=Вы ощущаете огромное количество энергии, излучаемой из гроба. Вы также начинаете отмечать различные нечестивые символы, выгравированные вокруг основания гроба.
adv.vampirecastle_vampirecastle_grave_3.67.d.n3.name=Внимательно посмотрите на ржавый гроб
adv.vampirecastle_vampirecastle_grave_3.67.d.n5.text=Когда вы открываете гроб, в сумраке просыпается могучая фигура, которая кричит древним голосом: «Ты боишься меня разбудить?»
adv.vampirecastle_vampirecastle_grave_3.67.d.n6.name=Откройте гроб.
adv.zedruu_zedruu.217.d.n0.text=Эти ворота заперты.
adv.zedruu_zedruu.217.d.n2.text=Ворота не заперты.
