adv.main_story_temple_of_liliana_town.263.x.n4.text=Обыскав большую часть города, вы все еще не нашли мэра, но, оглядываясь назад в этом направлении, вы, наконец, замечаете их на улице.
adv.main_story_temple_of_liliana_town.266.d.n0.text=За этими воротами вы видите легендарную Лилиану, которая, кажется, глубоко вникает в какой-то ритуал, но чтобы добраться до нее, нужно сначала найти мэра.
adv.main_story_temple_of_liliana_town.282.d.n0.text=Ритуал Лилианы, похоже, близится к завершению. Вы видите портал на другой стороне ее дома.
adv.main_story_temple_of_liliana_town.282.d.n1.text=Когда вы открываете ворота, она достигает вершины своих заклинаний, и груды мертвых по обе стороны портала начинают подниматься. Вы должны остановить ее, прежде чем эта орда нежити наступит на Шандалар!!!
adv.main_story_templeofchandra.1.d.n0.text=Эти зловещие черные ворота стоят между вами и вашей целью и / или гибелью. Хорошо смазанные шестерни удерживают его закрытым.
adv.main_story_templeofchandra.10.d.n0.text=Большой переключатель встроен в стену. Или, был. Кажется, он расплавился, что потребовало бы огромного тепла.
adv.main_story_templeofchandra.11.d.n0.text=Эти ворота, по-видимому, связаны с машинами на западе.
adv.main_story_templeofchandra.11.d.n1.name=Теперь, чтобы найти способ включить его...
adv.main_story_templeofchandra.16.d.n0.text=Большой переключатель встроен в стену. Или, был. Кажется, он расплавился, что потребовало бы огромного тепла.
adv.main_story_templeofchandra.17.d.n0.text=Эти ворота, кажется, заперты на месте каким-то механизмом, но вы не видите здесь никаких элементов управления.
adv.main_story_templeofchandra.17.d.n1.name=Пора их найти!
adv.main_story_templeofchandra.18.d.n0.text=Эти ворота, кажется, заперты на месте каким-то механизмом, но вы не видите здесь никаких элементов управления.
adv.main_story_templeofchandra.18.d.n1.name=Пора их найти.
adv.maze_maze_2.49.x.n0.text=Ваш противник начинает кричать, когда они возвращаются в каменную форму, но больше не уравновешиваются на пьедестале. Статуя падает и разбивается, а многие части падают в бассейн. Вы почти клянетесь, что слышите крик, слабо продолжающийся под поверхностью воды.
adv.maze_maze_2.58.d.n0.text=Внезапно ты слышишь странные звуки, идущие позади тебя. Странный голос кричит хрипло: «Интрудер!» Это твоя последняя ошибка!
adv.maze_maze_2.58.d.n1.name=У тебя плохое предчувствие по этому поводу.
adv.minibosses_slime_hive.137.d.n0.text=Надпись гласит: Канализационная система Шандалар в настоящее время находится на техническом обслуживании. Немного зелени загрязнило систему водоснабжения. У нас она полностью под контролем и канализационная система будет работать снова в кратчайшие сроки.
adv.minibosses_wastetown.137.d.n0.text=Надпись гласит: Канализационная система Шандалар в настоящее время находится на техническом обслуживании. Немного зелени загрязнило систему водоснабжения. У нас она полностью под контролем и канализационная система будет работать снова в кратчайшие сроки.
adv.monastery_unhallowed_abbey_1F.85.d.n0.text=Эта дверь заперта.
adv.monastery_unhallowed_abbey_1F.85.d.n2.text=Ворота не заперты.
adv.monastery_unhallowed_abbey_1F.85.d.n3.name=Разблокировать ключ культиста
adv.monastery_unhallowed_abbey_2F.113.d.n0.text=*Большой, внушительный демон перед вами ухмыляется*\n Ах, так что вы, должно быть, тот, кто освобождал мои жертвы... и доброволец, чтобы быть моим новым. Скажите мне, смертный, как ваши последние слова, которые не являются воем боли - зачем бросать мне вызов?
adv.monastery_unhallowed_abbey_2F.113.d.n1.text=*Дьявол насмехается.*\n Ах, благородный*герой*. Я должен был догадаться. Ваш вид умирает, как и любой другой, когда ваша сила иссякает - позвольте мне продемонстрировать!
adv.monastery_unhallowed_abbey_2F.113.d.n10.text=*Глаза у него узкие.*\n Слишком напуган для слов? Так что будь оно смертным. Ты все равно умрешь.
adv.monastery_unhallowed_abbey_2F.113.d.n11.name=...
adv.monastery_unhallowed_abbey_2F.113.d.n2.name=Потому что ты чудовище, и тебя надо остановить!
adv.monastery_unhallowed_abbey_2F.113.d.n4.text=*Дьявол смеется. *\n Я буду хвалить твои амбиции, если не твои чувства. Сражайся достаточно сильно, и я могу позволить тебе заменить ту неудачу, с которой ты имел дело наверху.
adv.monastery_unhallowed_abbey_2F.113.d.n5.name=Мне нужна власть, я заберу ее у того, что от тебя осталось.
adv.monastery_unhallowed_abbey_2F.113.d.n7.text=Демон моргает от удивления, а потом смеется. \n Ну, если это то, что ты ищешь, то найдешь больше, чем ты здесь рассчитывал. Надеюсь, тебе понравится последняя битва твоей жизни, бессмертная.
adv.monastery_unhallowed_abbey_2F.113.d.n8.name=Честно говоря, ты выглядела так, как будто ты будешь хорошим бойцом.
adv.monastery_unhallowed_abbey_2F.97.d.n0.text=Полупрозрачное, мерцающее красное поле блокирует ваш путь. Красные крики эхом разносятся по комнате позади вас.
adv.phyrexia_phyrexian_b1.62.d.n0.text=Большой, заметный переключатель выступает из стены в задней части лаборатории.
adv.phyrexia_phyrexian_b1.62.d.n1.text=Вы слышите звук металла, скользящего по металлу сзади.
adv.phyrexia_phyrexian_b1.62.d.n2.name=Переверните выключатель
adv.phyrexia_phyrexian_b1.76.d.n0.text=Эти ворота заперты. Должен быть способ открыть их где-нибудь еще здесь.
