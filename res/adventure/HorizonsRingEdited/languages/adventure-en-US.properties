adv.main_story_temple_of_gideon_town.266.d.n0.text=За этими воротами вы видите легендарную Лилиану, которая, кажется, глубоко вникает в какой-то ритуал, но чтобы добраться до нее, нужно сначала найти мэра.
adv.main_story_temple_of_gideon_town.282.d.n0.text=Ритуал Лилианы, похоже, близится к завершению. Вы видите портал на другой стороне ее дома.
adv.main_story_temple_of_gideon_town.282.d.n1.text=Когда вы открываете ворота, она достигает вершины своих заклинаний, и груды мертвых по обе стороны портала начинают подниматься. Вы должны остановить ее, прежде чем эта орда нежити наступит на Шандалар!!!
adv.main_story_temple_of_liliana_bog.240.d.n0.text=Старый крон на тебя прохожий, но не поднимает свой посох, чтобы напасть.
adv.main_story_temple_of_liliana_bog.240.d.n2.name=Напасть на ведьму
adv.main_story_temple_of_liliana_bog.240.d.n3.text=«Уходи с собой! Их у тебя не будет!» Она отступает, сбрасывая какие-то травы и грибы, которые она, похоже, собирала.
adv.main_story_temple_of_liliana_bog.240.d.n4.name=Медленно приближайтесь к ней
adv.main_story_temple_of_liliana_bog.240.d.n6.name=Напасть на ведьму
adv.main_story_temple_of_liliana_forest.270.d.n0.text=Между вами и районом на севере стоят большие ворота. Над воротами надпись: «Не мертвы, открыты внутри».
adv.main_story_temple_of_liliana_forest.270.d.n1.text=Ворота закрыты большим и сложным замком.
adv.main_story_temple_of_liliana_forest.270.d.n2.name=Открой ворота
adv.main_story_temple_of_liliana_forest.270.d.n3.name=Уходите в поисках ключа
adv.main_story_temple_of_liliana_forest.270.d.n5.text=Между вами и районом на севере стоят большие ворота. Над воротами надпись: «Не мертвы, открыты внутри».
adv.main_story_temple_of_liliana_forest.270.d.n6.text=С визгливым звуком, который может разбудить мертвых, ворота распахиваются.
adv.main_story_temple_of_liliana_forest.270.d.n7.name=Открой ворота
adv.main_story_temple_of_liliana_graveyard.256.d.n0.text=На краю отражающего бассейна стоит резной камень с изображением ангела, который как будто сражается в полете, воздух вокруг меча и щита статуи мерцает призматической дымкой. В другой обстановке это было бы величественно. Но здесь это зловеще.
adv.main_story_temple_of_liliana_graveyard.256.d.n10.text=После того, как статуя была разрушена, вы больше не чувствуете тяжелого присутствия, которое вы чувствовали до этого, которое оттолкнуло вас от границ кладбища.
adv.main_story_temple_of_liliana_graveyard.256.d.n11.name=Ищите выход
adv.main_story_temple_of_liliana_graveyard.256.d.n2.text=Вы также начинаете замечать, что многие из знакомых священных символов, выгравированных вокруг основания, скручены, неполны, изменены или иным образом кажутся «неправильными».
adv.main_story_temple_of_liliana_graveyard.256.d.n3.name=Внимательно посмотрите на статую
adv.main_story_temple_of_liliana_graveyard.256.d.n5.text=Что бы вы ни делали, это, кажется, работает. Сияние вокруг оружия статуи начинает рассеиваться, как и барьер вокруг кладбища. Вы также обнаружите, что можете направить эту энергию и чувствовать себя несколько освеженным ею. (+15 здоровья восстановлено)
adv.main_story_temple_of_liliana_graveyard.256.d.n6.name=Уменьшите силу статуи
adv.main_story_temple_of_liliana_graveyard.256.d.n7.text=Статуя начинает трескаться и смещаться, но не рушится. Вместо этого она говорит: «ВЫ ВЗАИМОСТИ С ВЛАСТЬЮ, КОТОРЫЕ НЕ ЗНАЕТЕ, СМЕРТИВНЫЕ!!» У вас мало времени, чтобы обработать это, прежде чем она нападет!
adv.main_story_temple_of_liliana_graveyard.270.d.n0.text=Звук его почти маскируется гудением от стен, но вы замечаете портал назад к входному отверстию слева.
