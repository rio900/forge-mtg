adv.main_story_temple_of_liliana_town.223.x.n4.text=Обыскав большую часть города, вы все еще не нашли мэра, но, оглядываясь назад в этом направлении, вы, наконец, замечаете их в конце улицы.
adv.main_story_temple_of_liliana_town.224.d.n0.text=Мэр может держаться от тебя подальше только до того, как тебе удастся прорваться сквозь толпу и добраться до него.
adv.main_story_temple_of_liliana_town.224.d.n2.name=Нападение на мэра
adv.main_story_temple_of_liliana_town.224.x.n0.text=Ты отрываешь ключ от холодных, мертвых (и снова мертвых) рук мэра. Теперь, когда он у тебя есть, между тобой и Лилианой не так много.
adv.main_story_temple_of_liliana_town.235.x.n0.text=Архив маркировки как проверенный
adv.main_story_temple_of_liliana_town.235.x.n2.text=В архивах мэра, похоже, нет.
adv.main_story_temple_of_liliana_town.235.x.n4.text=Обыскав большую часть города, вы все еще не нашли мэра, но, оглядываясь назад в этом направлении, вы, наконец, замечаете их на улице.
adv.main_story_temple_of_liliana_town.236.x.n0.text=Маркировка улицы как проверено
adv.main_story_temple_of_liliana_town.236.x.n2.text=Мэр не выходит на главную дорогу через город.
adv.main_story_temple_of_liliana_town.236.x.n4.text=Обыскав большую часть города, вы все еще не нашли мэра, но, оглядываясь назад в этом направлении, вы, наконец, замечаете их в конце улицы.
adv.main_story_temple_of_liliana_town.237.d.n0.text=На северном краю болота вы найдете небольшое поселение необычного макияжа. Даже глубоко в болотах редко можно увидеть где-нибудь рядом так много обитателей ночи и практиков нечестивых искусств в одном месте.
adv.main_story_temple_of_liliana_town.237.d.n1.text=Впереди вы видите довольно царственного выглядящего мага с большим ключом, висящим у него на поясе. Кажется, мэра достаточно легко опознать. Однако он кричит в знак признания по мере приближения, и очевидно не заинтересован оставаться с вами в чате.
adv.main_story_temple_of_liliana_town.237.d.n3.text=Мэр исчезает в облаке черного дыма, но вы уверены, что он все еще где-то в этом районе.
adv.main_story_temple_of_liliana_town.240.x.n0.text=Маркировка доков как проверенных
adv.main_story_temple_of_liliana_town.240.x.n2.text=Мэр, похоже, не в доках.
adv.main_story_temple_of_liliana_town.240.x.n4.text=Обыскав большую часть города, вы все еще не нашли мэра, но, оглядываясь назад в этом направлении, вы, наконец, замечаете их на улице.
