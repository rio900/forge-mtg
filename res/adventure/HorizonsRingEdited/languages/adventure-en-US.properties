adv.shared.walk_away=Уходи.
adv.skep_skep_outer.100.d.n0.text=День тебе, авантюрист!
adv.skep_skep_outer.101.d.n0.text=Добрый день, Авантюрист. Как видите, у нас тут довольно непростая ситуация.
adv.skep_skep_outer.101.d.n1.text=По неизвестным причинам Слайверсы Скепа стали враждебными и развернули рейдерские отряды в различных городах Шандалара, генерал Джаркхалд вызвал большого хозяина, чтобы разобраться с этой ситуацией.
adv.skep_skep_outer.101.d.n10.text=Эти штуки все еще ползут за стенами, я так понимаю, вы еще не позаботились об этой задаче?
adv.skep_skep_outer.101.d.n12.text=Я не думал, что ты действительно сможешь это сделать! Как и обещал, я дам тебе предмет, о котором говорил раньше. Спасибо, ребята. Слушайте! Наша работа здесь закончена, лидер этих вещей мертв! Давайте выбираться из этого жуткого места. Але на мне!
adv.skep_skep_outer.101.d.n13.name=Слизняки больше не будут проблемой.
adv.skep_skep_outer.101.d.n2.name=Что здесь происходит?
adv.skep_skep_outer.101.d.n3.text=Ну, мы уже пробовали это раньше, но из-за огромного количества Слайверсов у нас не было большого прогресса за пределами отгораживания улья, чтобы предотвратить дальнейшие нападения на окружающих жителей деревни.
adv.skep_skep_outer.101.d.n4.name=Так ты собираешься просто штурмовать улей и надеяться на лучшее?
adv.skep_skep_outer.101.d.n5.text=Слайверсы образуют ульевоум, а это значит, что если их королева каким-то образом будет нейтрализована, то щепка больше не будет проблемой. К сожалению, у нас нет храброго добровольца, который готов войти в улей и разобраться с королевой...
adv.skep_skep_outer.101.d.n6.name=Как я могу быть полезен, чтобы справиться с Слайверсом?
adv.skep_skep_outer.101.d.n7.text=Помимо благодарности жителей Шандалара за то, что они имеют дело с этими ужасными существами, я дам вам новый причудливый броня, который поможет вам в ваших предстоящих приключениях. Справляйтесь с королевой и вернитесь ко мне, чтобы получить вашу награду. Я хочу, чтобы мои люди открыли ворота, чтобы вы вошли в улей. Удачи искателю приключений!
adv.skep_skep_outer.101.d.n8.name=Я могу иметь дело с королевой, но что в этом для меня?
adv.skep_skep_outer.101.d.n9.name=Конец
adv.skep_skep_outer.150.d.n0.text=День тебе, авантюрист!
adv.skep_skep_outer.151.d.n0.text=День тебе, авантюрист!
adv.skep_skep_outer.238.d.n0.text=Эти штуки не пройдут мимо этих ворот, ты можешь на это рассчитывать, авантюрист.
adv.skep_skep_outer.239.d.n0.text=День тебе, авантюрист!
adv.skep_skep_outer.240.d.n0.text=День тебе, авантюрист!
adv.skep_skep_outer.241.d.n0.text=День тебе, авантюрист!
adv.skep_skep_outer.242.d.n0.text=Эти ворота заперты.
adv.skep_skep_outer.242.d.n2.text=Ворота не заперты.
adv.skep_skep_outer.242.d.n3.name=Скачать Outer Gate Key
adv.skep_skep_outer.250.d.n0.text=Лошадь смотрит на тебя с незаинтересованностью.
adv.skep_skep_outer.256.d.n0.text=Прозрачное, мерцающее красное поле блокирует ваш путь. Странные звуки эхом разносятся по комнате позади вас.
adv.skep_skep_outer.256.d.n2.name=Красное поле тает на глазах, и ты свободен идти вперед.
adv.skep_skep_outer.266.d.n0.text=Много ртов, чтобы покормить, мало времени для разговоров.
adv.skep_skep_outer.266.d.n2.text=Куда все эти причудливые люди пошли? Кто-то сказал "свободный эль"?
adv.skep_skep_outer.57.d.n0.text=The Wounded Sliver смотрит на вас с интересом
adv.skep_skep_outer.57.d.n1.text=По крайней мере, я была королевой Слайверсов Скепа, пока моя должность не была узурпирована.
adv.skep_skep_outer.57.d.n10.name=Считай, что это сделано.
adv.skep_skep_outer.57.d.n11.text=Победи Королеву Слайверов, прежде чем я потеряю последнюю силу.
adv.skep_skep_outer.57.d.n13.text=Моя... моя благодарность вам, незнакомец. Я чувствую, что мои силы медленно возвращаются. Как и обещала, я снова возьму под контроль Слайверсов как их королеву. Народ Шандалара больше не должен бояться Слайверсов Скепа. Хотя будьте предупреждены, авантюрист, мои дети все равно будут защищаться от любого злоумышленника, который войдет в Скеп. Прощай, авантюрист!
adv.skep_skep_outer.57.d.n14.name=Королева Слайверов потерпела поражение!
adv.skep_skep_outer.57.d.n2.name=Что ты такое?
adv.skep_skep_outer.57.d.n3.text=Тысячелетиями я держала Слайверсов из Скепа здоровыми и мирными, держала их под контролем, чтобы они не нападали на посторонних. Все изменилось, когда Королева Слайверов напала и взяла под свой контроль этот улей. Как видите, я не смогла победить ее.
adv.skep_skep_outer.57.d.n4.name=О чем ты говоришь?
adv.skep_skep_outer.57.d.n5.text=Точно, она собирала могущественную толпу Слайверсов со всей мультивселенной. Скоро у нее будет армия, достаточно большая, чтобы завоевать весь Шандалар.
adv.skep_skep_outer.57.d.n6.name=Так что, я думаю, Королева Слайверов заставляет Слайверсов Скепа быть такими агрессивными?
adv.skep_skep_outer.57.d.n7.text=Я ценю ваш энтузиазм, однако королева не является противником, чтобы легко принять на себя. Во-первых, чтобы получить доступ к ее логову нужно победить ее трех ее лейтенантов, которые разбросаны здесь, в Скепе. Только тогда волшебный щит исчезнет и вы сможете войти в ее логово.
adv.skep_skep_outer.57.d.n8.name=Где она находится? Я позабочусь об этом.
adv.skep_skep_outer.57.d.n9.text=Как только вы разберетесь с королевой, вернитесь ко мне. Как только я буду установлена как королева улья из ломтиков Шандалара, я обещаю вам, что Щелкуны Скепа никогда не будут представлять опасности для народа Шандалара. Также, возьмите этот Ульян, Он позволит вашим существам стать Щелкунами, вызывая путаницу для Королевы Слайверов.
adv.skep_skep_outer.73.d.n0.text=Много ртов, чтобы покормить, мало времени для разговоров.
adv.skep_skep_outer.74.d.n0.text=Надпись гласит: Незнакомец, скажи нашим родственникам, что мы лежали здесь, оставаясь верными нашей борьбе с скользкой угрозой.
adv.skep_skep_outer.93.d.n0.text=День тебе, авантюрист!
adv.skep_skep_outer.99.d.n0.text=День тебе, авантюрист!
adv.snowabbey_snowabbey_1.78.d.n0.text=Надпись гласит: Добро пожаловать в рыбацкую деревню Харан.
adv.tibalt_tibalt_f0.189.d.n0.text=Приближаясь, ворота замка открываются жутким скрипом, открывая темный двор, окутанный тревожной тишиной. Земля под ногами чувствует холод и непреклонность, словно сама земля отшатывается от присутствия владения Тибальта. Зловещие горгульи спускаются со стен замка, их гротескные формы словно оживают в угасающем свете.
adv.tibalt_tibalt_f1.136.x.n0.text=Дьявол издает пронзительный крик, когда падает на землю, его кровь смешивается с кровью его жертв, вы видите, что красный барьер исчезает.
adv.tibalt_tibalt_f1.217.d.n0.text=Прозрачное, мерцающее красное поле блокирует ваш путь.В этих склепах скрывается древнее зло, мешающее вам войти в комнату перед вами...
adv.tibalt_tibalt_f2.119.x.n0.text=Циклопы издают пронзительный крик, когда он падает на землю. Его кровь смешивается с кровью его жертв, вы видите, что красный барьер исчезает. Путь к Тибальту открыт.
adv.tibalt_tibalt_f2.200.d.n0.text=Прозрачное, мерцающее красное поле блокирует ваш путь.В этих склепах скрывается древнее зло, мешающее вам войти в комнату перед вами...
adv.tibalt_tibalt_f3.119.x.n0.text=Пытник издает пронзительный крик, когда падает на землю, его кровь смешивается с кровью его замученных жертв, вы видите, как исчезает красный барьер. Путь к камерам Тибальта открыт.
adv.tibalt_tibalt_f3.201.d.n0.text=Прозрачное, мерцающее красное поле блокирует ваш путь.В этих склепах скрывается древнее зло, мешающее вам войти в комнату перед вами...
adv.tibalt_tibalt_f3.204.d.n0.text=Эта дверь заперта.
adv.tibalt_tibalt_f3.204.d.n2.text=Ворота незаперты, хотя ключ ломается, когда вы открываете дверь.
adv.tibalt_tibalt_f3.204.d.n3.name=Разблокировать ключи с Torturer
adv.tibalt_tibalt_f4.168.d.n0.text=Эта дверь заперта.
adv.tibalt_tibalt_f4.168.d.n2.text=Ворота не заперты.
adv.tibalt_tibalt_f4.168.d.n3.name=Разблокировать ключ Тибальта
adv.tibalt_tibalt_f4.176.d.n0.text=Низкая, преследующая мелодия играет на заднем плане, исходящая из невидимых источников.Звук как бы эхом перекликается с самими стенами, создавая тревожную атмосферу, добавляющую ощущение предчувствия.Странные артефакты и тайные реликвии разбросаны по всей камере, свидетельствующие о мастерстве Тибальта в темной магии.
adv.towns_plains_town.53.d.n0.text=Я - большая дверь.
adv.towns_plains_town.53.d.n1.name=Ладно.
adv.vampirecastle_vampirecastle_4.82.d.n0.text=Большие ворота блокируют путь. Через бары можно увидеть внушительную фигуру в комнате за ее пределами.
adv.vampirecastle_vampirecastle_4.82.d.n2.text=Ворота не заперты.
adv.vampirecastle_vampirecastle_4.82.d.n3.name=Разблокируйте ключ
adv.vampirecastle_vampirecastle_4.98.d.n0.text=Бедный крестьянин пасется перед тобой.
adv.vampirecastle_vampirecastle_4.98.d.n1.text=Спасибо, сэр, пожалуйста, примите этот пункт как знак моей благодарности.
adv.vampirecastle_vampirecastle_4.98.d.n2.name=Ты свободен, Сорин справилась.
adv.vampirecastle_vampirecastle_4.98.d.n3.name=(перенаправлено с «Take the Challenge Coin»)
adv.vampirecastle_vampirecastle_grave_1.62.d.n0.text=Вы видите гроб, лежащий в центре склепа. Эта реликвия вампирской истории, когда-то сосуд для бессмертных, теперь стояла как изношенное временем свидетельство о прохождении веков, молчаливое свидетельство тайн и теней, которые развернулись в его пределах. Древний гроб, хранилище веков, источал ауру как угрозы, так и меланхолии, молчаливый часовой к тайнам ночного царства.
adv.vampirecastle_vampirecastle_grave_1.62.d.n2.text=Вы ощущаете огромное количество энергии, излучаемой из гроба. Вы также начинаете отмечать различные нечестивые символы, выгравированные вокруг основания гроба.
adv.vampirecastle_vampirecastle_grave_1.62.d.n3.name=Внимательно посмотрите на ржавый гроб
adv.vampirecastle_vampirecastle_grave_1.62.d.n5.text=Когда вы открываете гроб, в сумраке просыпается могучая фигура, которая кричит древним голосом: «Ты боишься меня разбудить?»
adv.vampirecastle_vampirecastle_grave_1.62.d.n6.name=Откройте гроб.
adv.vampirecastle_vampirecastle_grave_1.63.d.n0.text=Прозрачное, мерцающее красное поле блокирует ваш путь.В этих склепах скрывается древнее зло, мешающее вам войти в комнату перед вами...
adv.vampirecastle_vampirecastle_grave_2.100.d.n0.text=Вы подходите к гробу, покрытому паутиной, лежащему в центре комнаты.
